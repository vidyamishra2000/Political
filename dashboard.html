<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Political Analytics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f172a;
color:white;
font-family:Inter,sans-serif;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:32px;
font-weight:800;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:16px;
}

.card-title{
font-size:13px;
color:#94a3b8;
}

.card-value{
font-size:34px;
font-weight:800;
margin-top:10px;
}

.chart-box{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

canvas{
background:white;
border-radius:12px;
padding:10px;
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

select{
padding:12px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
}

button{
padding:12px 18px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="header">

<div class="title">
Political Analytics Dashboard
</div>

<div>
<button onclick="loadDashboard()">
Refresh Dashboard
</button>
</div>

</div>

<div class="filters">

<select id="districtFilter">
<option value="">All Districts</option>
</select>

<select id="assemblyFilter">
<option value="">All Assembly</option>
</select>

</div>

<div class="cards">

<div class="card">
<div class="card-title">Total Leaders</div>
<div class="card-value" id="totalLeaders">0</div>
</div>

<div class="card">
<div class="card-title">Districts</div>
<div class="card-value" id="totalDistricts">0</div>
</div>

<div class="card">
<div class="card-title">Blocks</div>
<div class="card-value" id="totalBlocks">0</div>
</div>

<div class="card">
<div class="card-title">Panchayats</div>
<div class="card-value" id="totalPanchayats">0</div>
</div>

<div class="card">
<div class="card-title">Castes</div>
<div class="card-value" id="totalCastes">0</div>
</div>

</div>

<div class="chart-box">
<canvas id="districtChart"></canvas>
</div>

<div class="chart-box">
<canvas id="genderChart"></canvas>
</div>

<div class="chart-box">
<canvas id="categoryChart"></canvas>
</div>

<div class="chart-box">
<canvas id="casteChart"></canvas>
</div>

<script>

  const SUPABASE_URL =
"https://dsydbczvyppqwxpeppoo.supabase.co";

const SUPABASE_ANON_KEY =
"PASTE_YOUR_EXISTING_KEY_HERE";

const headers = {
apikey:SUPABASE_ANON_KEY,
Authorization:`Bearer ${SUPABASE_ANON_KEY}`
};

let districtChart;
let genderChart;
let categoryChart;
let casteChart;

  async function getData(endpoint){

const res =
await fetch(
`${SUPABASE_URL}/rest/v1/${endpoint}`,
{
headers
}
);

return await res.json();

}
  async function loadDashboard(){

const leaders =
await getData(
'leaders?select=id,district,block,panchayat,caste,gender,category'
);

document.getElementById(
'totalLeaders'
).innerText =
leaders.length;

document.getElementById(
'totalDistricts'
).innerText =
new Set(
leaders.map(x=>x.district)
).size;

document.getElementById(
'totalBlocks'
).innerText =
new Set(
leaders.map(x=>x.block)
).size;

document.getElementById(
'totalPanchayats'
).innerText =
new Set(
leaders.map(x=>x.panchayat)
).size;

document.getElementById(
'totalCastes'
).innerText =
new Set(
leaders.map(x=>x.caste)
).size;

createDistrictChart(leaders);

createGenderChart(leaders);

createCategoryChart(leaders);

createCasteChart(leaders);

}
  function createDistrictChart(data){

const counts={};

data.forEach(x=>{

if(!x.district) return;

counts[x.district]=
(counts[x.district]||0)+1;

});

const labels=
Object.keys(counts)
.sort((a,b)=>
counts[b]-counts[a]
)
.slice(0,20);

const values=
labels.map(x=>counts[x]);

if(districtChart)
districtChart.destroy();

districtChart=
new Chart(
document.getElementById(
'districtChart'
),
{
type:'bar',

data:{
labels,
datasets:[{
label:'Leaders',
data:values
}]
},

options:{
responsive:true,
plugins:{
title:{
display:true,
text:'Top District Wise Leaders'
}
}
}
}
);

}
  function createGenderChart(data){

const counts={};

data.forEach(x=>{

const key=
x.gender || 'Unknown';

counts[key]=
(counts[key]||0)+1;

});

if(genderChart)
genderChart.destroy();

genderChart=
new Chart(
document.getElementById(
'genderChart'
),
{
type:'pie',

data:{
labels:Object.keys(counts),

datasets:[{
data:Object.values(counts)
}]
},

options:{
responsive:true,
plugins:{
title:{
display:true,
text:'Gender Composition'
}
}
}
}
);

}
  function createCategoryChart(data){

const counts={};

data.forEach(x=>{

const key=
x.category || 'Unknown';

counts[key]=
(counts[key]||0)+1;

});

if(categoryChart)
categoryChart.destroy();

categoryChart=
new Chart(
document.getElementById(
'categoryChart'
),
{
type:'doughnut',

data:{
labels:Object.keys(counts),

datasets:[{
data:Object.values(counts)
}]
},

options:{
responsive:true,
plugins:{
title:{
display:true,
text:'Category Composition'
}
}
}
}
);

}
  function createCasteChart(data){

const counts={};

data.forEach(x=>{

if(!x.caste) return;

counts[x.caste]=
(counts[x.caste]||0)+1;

});

const labels=
Object.keys(counts)
.sort((a,b)=>
counts[b]-counts[a]
)
.slice(0,20);

const values=
labels.map(x=>counts[x]);

if(casteChart)
casteChart.destroy();

casteChart=
new Chart(
document.getElementById(
'casteChart'
),
{
type:'bar',

data:{
labels,
datasets:[{
label:'Leaders',
data:values
}]
},

options:{
responsive:true,
plugins:{
title:{
display:true,
text:'Top 20 Castes'
}
}
}
}
);

}
  loadDashboard();

</script>

</body>

</html>
